{{ define "main" }}
<main id="main-content" class="section">
  <div class="container">
    <h1 class="text-4xl md:text-5xl">{{ .Title }}</h1>
    <div class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="card block hover:border-primary-200 hover:shadow-md">
          <h2 class="text-xl">{{ .Title }}</h2>
          {{ with .Description }}<p class="mt-3 text-sm leading-6 text-slate-600">{{ . }}</p>{{ end }}
        </a>
      {{ end }}
    </div>
  </div>
</main>
{{ end }}
