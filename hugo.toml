locale = "zh-cn"
title = "SportsHub.AI"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
ignoreFiles = [
  "^content/(zh|en)/(blog|features|jobs)/",
  "^content/(zh|en)/(careers|pricing)\\.md$"
]

