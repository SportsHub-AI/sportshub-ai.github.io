# Required Features
pygmentsCodeFences = true
pygmentsUseClasses = true
enableEmoji = true
enableGitInfo = true

# Required Module Configuration
[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

# Required Build Configuration
[build]
  writeStats = true

# Required Markup Configuration
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# Theme Parameters (共享参数，可在 zh/en 各自语言内容中重写)
[params]
  description = "Your site description"
  author = "Your Name"
  logo = "/images/company-logo.jpeg"

  googleAnalytics = "G-XXXXXXXXXX"

  [params.header]
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"

    [params.header.logo]
      src = "/images/company-logo.jpeg"

    #[params.header.buttons]
    #  [params.header.buttons.getStarted]
    #    text = "联系我们"
    #    url = "mailto:business@sportshub-ai.com"

  [params.cta]
    enable = true
    title = "准备开始了吗？"
    description = "加入使用我们平台的企业"
    [params.cta.primary_button]
