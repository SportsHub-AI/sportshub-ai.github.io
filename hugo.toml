# Required Features
pygmentsCodeFences = true
pygmentsUseClasses = true
enableEmoji = true
enableGitInfo = true

# Required Module Configuration
[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"

# Required Build Configuration
[build]
  writeStats = true

# Required Markup Configuration
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = true
    codeFences = true
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

# Theme Parameters (共享参数，可在 zh/en 各自语言内容中重写)
[params]
  description = "AI-powered sports data analysis and training products."
  author = "SportsHub.AI"
  logo = "/images/brand/sportshubai-black.png"

  googleAnalytics = "G-XXXXXXXXXX"

  [params.header]
    background = "bg-white/80 backdrop-blur-sm"
    border = "border-b border-gray-100"

    [params.header.logo]
      src = "/images/brand/sportshubai-black.png"

    #[params.header.buttons]
    #  [params.header.buttons.getStarted]
    #    text = "联系我们"
    #    url = "mailto:business@sportshub-ai.com"

  [params.cta]
    enable = true
    title = "准备重新理解训练数据？"
    description = "联系 SportsHub.AI 获取产品试用、团队部署或数据合作信息。"
    [params.cta.primary_button]
      text = "联系我们"
      url = "/zh/contact/"
    [params.cta.secondary_button]
      text = "查看解决方案"
      url = "/zh/products/"

  [params.social]
